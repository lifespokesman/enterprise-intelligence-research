stop_condition:
  gap:
    - "major_claims_tested"
    - "counter_evidence_found"
    - "boundary_conditions_known"
    - "no_material_update_twice"
  problem:
    - "major_gaps_resolved"
    - "hypothesis_revised_or_rejected"
    - "engineering_hypothesis_defined"

automation_notes:
  recommended_cadence:
    research_heartbeat: "Mon/Wed/Fri"
    weekly_synthesis: "Once per week"
  current_phase: "ready-for-automation-pilot"
  note: >
    第一轮手工 GAP-001 已完成。v0.2 起 Research Heartbeat 只写 Evidence Ledger + RESEARCH_STATE；
    Problem / NOW 的正式认知变化由 Weekly Synthesis 或人工审核完成。下一轮由自动化试跑 GAP-002。
