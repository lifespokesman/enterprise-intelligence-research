active_problem:
  id: "RP-002-02"
  title: "Business Action Layer"
  path: "research/problems/RP-002-02-business-action-layer.md"
  status: "exploring"

active_hypothesis:
  id: "H-RP002-06"
  version: "H1"
  status: "revised"
  statement: >
    DDD Application/Domain Service、CQRS Command 与 Workflow/Durable Runtime 已经承担
    Business Action 的大部分业务语义和可靠执行职责；Agent 时代新增或显著强化的是围绕
    模型控制调用的一组治理与安全要求，包括授权范围发现、Typed Schema、权限/人工确认、显式状态句柄、
    非可信元数据处理、输入输出校验、限流和审计。当前证据只能支持存在一个 model-facing governance boundary，
    不能证明必须形成独立 Agent Control Plane。独立 Business Action Layer 只在高影响、跨系统、审批密集、
    长时运行或多调用者需要稳定契约时具有成立条件；简单低风险单系统动作可由强 Domain API/Command
    加 Tool Schema 直接承担。
  proposed_revision:
    from: "H0"
    triggered_by: ["E-001", "E-002", "E-003", "E-004", "E-005"]
    change: "传统架构已覆盖核心业务语义与可靠执行；Agent 增量集中在模型控制调用的治理与安全边界。"
    boundary_conditions:
      - "高影响、跨系统、审批密集或长时运行的业务突变"
      - "多个 Agent/应用/Workflow 需要共享稳定业务契约"
      - "低风险、单系统、可逆 CRUD 可继续使用 Domain API/Command + Tool Schema"
    unresolved_gap: "独立 Action Registry/Runtime 相对 Service/Command/Workflow 组合的可测收益阈值"

evidence_gaps:
  - id: "GAP-001"
    priority: "P0"
    status: "provisionally_saturated"
    question: >
      DDD Application Service、Domain Service、CQRS Command、Workflow/BPM 等传统企业架构，
      是否已经承担了 Business Action 的核心职责？
      如果是，Agent 时代真正新增或显著强化的机制是什么？
    evidence_needed:
      - "architecture_pattern"
      - "implementation"
      - "counter_evidence"
      - "boundary_condition"
    completion_criteria:
      - "至少 2 个独立高质量来源"
      - "至少 1 个 Primary / Implementation 级来源"
      - "能明确指出 Business Action 与既有模式的同构部分和新增部分"
      - "至少找到 1 个反例或替代解释"
    material_evidence_count: 5
    last_result:
      date: "2026-09-18"
      outcome: "H0 -> H1"
      summary: >
        DDD/Application/Domain Service、CQRS Command 与 BPMN/Durable Workflow 已覆盖大部分
        业务语义、命令边界和可靠执行；MCP 证据显示 Agent 时代强化了模型控制调用的发现、
        schema、确认、授权、校验和审计控制面；简单低风险动作仍可直接使用 Domain API/Tool。

  - id: "GAP-002"
    priority: "P0"
    status: "active"
    question: >
      Palantir Ontology Actions / Functions 与传统 Application Service / Command / Workflow
      的实质差异是什么？为什么 Action 被放到 Ontology / operational layer 中？
    evidence_needed:
      - "product_fact"
      - "official_docs"
      - "mechanism_comparison"
      - "counter_evidence"
    material_evidence_count: 0
    last_result: null

  - id: "GAP-003"
    priority: "P1"
    status: "queued"
    question: >
      ServiceNow、Salesforce、SAP 等企业平台如何让 Agent 执行受治理的业务状态修改？
      这些产品是否存在稳定业务动作契约、权限治理、审批、事务、补偿、审计和 runtime binding？
    evidence_needed:
      - "product_fact"
      - "industry_case"
      - "implementation"
      - "counter_evidence"
    material_evidence_count: 0
    last_result: null

next_action:
  type: "research"
  gap: "GAP-002"
  instruction: >
    对照 Palantir Ontology Actions / Functions 与传统 Application Service / Command / Workflow，
    只保留真正能判断 Operational/Ontology 层是否提供新增稳定机制的 3–5 条证据，并主动寻找反证。

candidate_questions:
  - "什么样的风险、跨系统协调和调用者复用阈值，足以证明独立 Action Registry/Runtime 优于既有 Service/Command/Workflow 组合？"
  - "Agent 的 consent/authority/audit 治理要求应由 MCP 适配器、既有 Workflow/Policy 层还是专门的治理边界承担？"

research_history:
  - date: "2026-09-18"
