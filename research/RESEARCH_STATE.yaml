active_hypothesis:
  id: "H-RP002-06"
  version: "H1"
  status: "revised"
  statement: >
    DDD Application/Domain Service、CQRS Command 与 Workflow/Durable Runtime 已经承担
    Business Action 的大部分业务语义和可靠执行职责；Agent 时代新增或显著强化的是围绕
    模型控制调用的一组治理与安全要求，包括授权范围发现、类型化 Schema、权限/人工确认、显式状态句柄、
    非可信元数据处理、输入输出校验、限流和审计。当前证据只能支持存在一个面向模型的治理边界，
    不能证明必须形成独立 Agent Control Plane。独立 Business Action Layer 只在高影响、跨系统、审批密集、
    长时运行或多调用者需要稳定契约时具有成立条件；简单低风险单系统动作可由强 Domain API/Command
    加 Tool Schema 直接承担。
  proposed_revision:
    from: "H1"
    triggered_by: ["E-006", "E-007", "E-008", "E-009", "E-010", "E-011", "E-012", "E-013", "E-014", "E-015", "E-016", "E-017", "E-018", "E-019", "E-020", "E-021", "E-022"]
    change: >
      v0.4 多证据域研究进一步把 H1 从“受治理的 Action Contract”提升为候选战略判断：
      模型能力增强会逐步吸收工具选择、参数生成、部分流程编排与 glue code，
      但 Agent Identity、Delegated Authority、Policy、State Constraint、Approval、Audit 与 Provenance
      属于企业授权与状态治理的结构性约束，不会因为模型更聪明而自然消失；
      合成工程验证进一步显示，在相同 Service/Workflow Runtime 下，显式契约的可测收益主要来自
      统一治理边界、审计/provenance 与多调用者变更隔离，而不是新的事务或补偿能力。
      因此长期稳定资产更可能是“受治理能力契约（Governed Capability Contract，候选概念）”，
      独立 Action Runtime 仍只是条件性的工程选择。E-022 的可运行实现进一步表明，
      授权、审批、防重放与签名审计可以集中在独立治理边界，但其文件型并发锁在 Windows
      下出现丢失写入与死锁，且未覆盖业务补偿和运行中权限撤销；因此治理边界的工程可行性
      与 durable execution / cross-system reliability 必须分开判断。
    boundary_conditions:
      - "Governed Capability Contract 仅为候选战略概念，不得自动升级为独立 Layer / Platform / Runtime"
      - "高影响、需要统一提交条件/权限/审计的业务状态变化更需要显式治理边界"
      - "跨系统副作用仍需 Workflow/Durable Runtime、幂等与补偿机制"
      - "低风险、单系统、可逆 CRUD 可继续使用 Domain API/Command + Tool Schema"
      - "若未来 Agent Identity + Policy Engine + 通用 API Schema 能覆盖高影响场景，则独立 Capability Contract 的价值应被下调"
      - "本轮合成原型的治理/变更收益依赖字段模型与清单假设，尚需真实实现、并发和故障注入复现"
      - "文件型治理实现的跨平台并发可靠性不能由单机 happy path 推断；需验证 daemon/数据库或 durable store"
      - "token 过期/防重放与人工拒绝不等同于企业目录级 permission revocation"
    unresolved_gap: "真实多 Agent、跨团队 API 演进与故障注入下，通用 API + Policy 与显式 Governed Capability Contract 的治理收益/维护成本差异"
  strategic_thesis_candidate:
    id: "ST-RP002-01"
    maturity: "Strategic Thesis (Candidate)"
    statement: >
      随着模型能力增强，Business Action 的执行编排会越来越动态和自动生成，
      但企业对真实世界改变权的治理不会被模型吸收；长期稳定资产更可能围绕
      Agent Identity、Delegated Authority、Policy、State Constraint、Approval、Audit 与 Provenance
      形成受治理能力契约，而是否需要独立 Action Runtime 仍取决于工程场景。
    alternative_hypothesis: >
      Agent Identity + Policy Engine + 通用 API / MCP Schema 已足够，
      独立 Capability / Action Contract 最终会成为不必要的中间层。
    falsifiable_predictions:
      - "模型与自动生成 Workflow 越成熟，平台仍持续强化 Agent Identity、细粒度授权、审批、审计与 provenance。"
      - "高影响生产 Agent 不会普遍获得未经显式授权和确定性策略仲裁的原始 API 自由调用权。"
      - "若主流平台取消显式 Capability/Action 契约，仅靠通用 API Schema + Policy 仍能稳定治理高影响动作，则该 Thesis 应被收窄。"

evidence_gaps:
  - id: "GAP-001"
    priority: "P0"
    status: "provisionally_saturated"
    question: >
      DDD Application Service、Domain Service、CQRS Command、Workflow/BPM 等传统企业架构，
      是否已经承担了 Business Action 的核心职责？
      如果是，Agent 时代真正新增或显著强化的机制是什么？
    evidence_needed:
      - "architecture_pattern"
      - "implementation"
      - "counter_evidence"
      - "boundary_condition"
    completion_criteria:
      - "至少 2 个独立高质量来源"
      - "至少 1 个 Primary / Implementation 级来源"
      - "能明确指出 Business Action 与既有模式的同构部分和新增部分"
      - "至少找到 1 个反例或替代解释"
    material_evidence_count: 5
    last_result:
      date: "2026-09-18"
      outcome: "H0 -> H1"
      summary: >
        DDD/Application/Domain Service、CQRS Command 与 BPMN/Durable Workflow 已覆盖大部分
        业务语义、命令边界和可靠执行；MCP 证据显示 Agent 时代强化了模型控制调用的发现、
        schema、确认、授权、校验和审计控制面；简单低风险动作仍可直接使用 Domain API/Tool。

  - id: "GAP-002"
    priority: "P0"
    status: "provisionally_saturated"
    question: >
      Palantir Ontology Actions / Functions 与传统 Application Service / Command / Workflow
      的实质差异是什么？为什么 Action 被放到 Ontology / operational layer 中？
    evidence_needed:
      - "product_fact"
      - "official_docs"
      - "mechanism_comparison"
      - "counter_evidence"
    material_evidence_count: 5
    last_result:
      date: "2026-09-18"
      outcome: "H1 -> proposed H1.1"
      summary: >
        Palantir 官方文档显示 Ontology Action 是绑定对象/状态的单事务状态变更契约，
        由提交条件、权限/读写授权、Rule/Function 绑定、副作用与版本化 Action Log/metrics 共同形成跨应用复用的操作界面；
        但 Function 仍是执行绑定，Action revert 不回滚 webhook/notification，不能把该机制解释为独立 Agent Control Plane 或跨系统原子 Runtime。

  - id: "GAP-003"
    priority: "P1"
    status: "provisionally_saturated"
    question: >
      ServiceNow、Salesforce、SAP 等企业平台如何让 Agent 执行受治理的业务状态修改？
      这些产品是否存在稳定业务动作契约、权限治理、审批、事务、补偿、审计和 runtime binding？
    evidence_needed:
      - "product_fact"
      - "industry_case"
      - "implementation"
      - "counter_evidence"
    material_evidence_count: 4
    last_result:
      date: "2026-09-18"
      outcome: "NO_MATERIAL_UPDATE"
      summary: >
        按 next_action 进入高影响跨系统流程的工程验证设计，但当前没有可复核的工程实现、公开基准或可运行测试环境；
        未新增 Material Evidence，保留既有 H1 -> proposed H1.1，不制造伪进展。

  - id: "GAP-004"
    priority: "P0"
    status: "provisionally_saturated"
    maturity: "Strategic Thesis (Candidate)"
    question: >
      当模型推理、工具调用和长程执行能力显著增强后，今天的 Action/Skill/Workflow 绑定中，
      哪些是结构性企业约束，哪些只是当前 AI 能力不足形成的过渡架构？
      企业长期稳定资产更可能是独立 Action Runtime、受治理能力契约，还是 Policy + API 组合？
    evidence_needed:
      - "theory_paper"
      - "product_implementation"
      - "case_engineering"
      - "counter_evidence"
    evidence_domain_coverage:
      theory_paper: true
      product_implementation: true
      case_engineering: true
      counter_evidence: true
    material_evidence_count: 8
    last_result:
      date: "2026-10-26"
      outcome: "conditional engineering support with implementation counter-evidence"
      summary: >
        Toolformer 提供模型可吸收工具选择/参数生成的反证；Agent 安全论文把 least privilege、
        complete mediation、delegated authority 与可执行工具约束识别为模型外的系统安全要求；
        Microsoft Entra Agent ID 将 Agent 身份与授权治理产品化；Engine 案例显示退款/交易/账户更新仍依赖严格测试与安全；
        SAP Joule Studio 同时展示“执行逻辑自动生成”与“权限/策略/隔离/审计继续强化”。
        合成双路线工程验证显示，在共享 Service/Workflow Runtime 下，两条路线的状态迁移与补偿结果一致，
        显式契约的收益集中在审计字段覆盖、多 Agent 复用和变更影响隔离；Delego-Dev/delego 的固定提交
        在 49 个授权/审批/审计/token 场景通过，说明治理边界可运行；但 Windows 文件锁并发测试出现
        丢失写入与死锁，MCP facade 受 mcp 2.x API 不兼容，且未覆盖真实权限撤销、业务补偿或通用 API 对照。
        结果支持治理边界的工程可行性，同时挑战“本地文件型实现已具备生产级并发可靠性”的隐含前提；
        不证明需要独立 Action Runtime，也不足以升级为 Architecture Principle。

