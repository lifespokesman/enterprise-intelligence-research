name: Repository Integrity

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install integrity-check dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check repository state and links
        run: python3 scripts/check_repository_state.py
